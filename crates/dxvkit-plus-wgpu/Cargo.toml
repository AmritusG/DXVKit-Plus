[package]
name = "dxvkit-plus-wgpu"
description = "DXVKit Plus on wgpu 30: BC block uploads straight into BC textures through persistent staging (pipelined, or decoded straight into GPU-visible memory), direct sampling of plain-BC frames, and WGSL conversion (HAP Q scaled YCoCg, alpha-only, HDR, 4:2:0 YCbCr) into RGBA."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true


# LMBD's Zstd decode backend, forwarded to dxvkit-plus-core (see its [features]).
[features]
default = ["zstd-c"]
zstd-c = ["dxvkit-plus-core/zstd-c"]
zstd-rust = ["dxvkit-plus-core/zstd-rust"]

[dependencies]
dxvkit-plus-core = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }

[dev-dependencies]
dxvkit-plus-core = { workspace = true }
