[package]
name = "dxvkit-plus-cli"
description = "The dxvkit-plus command: probe, decode (frame N to PNG), bench (decode p50/p99) and verify (CPU vs GPU, frame identity, seek) for every codec DXVKit Plus plays."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[[bin]]
name = "dxvkit-plus"
path = "src/main.rs"

[lints]
workspace = true


# LMBD's Zstd decode backend, forwarded to dxvkit-plus-core (see its [features]).
[features]
default = ["zstd-c"]
zstd-c = ["dxvkit-plus-core/zstd-c"]
zstd-rust = ["dxvkit-plus-core/zstd-rust"]

[dependencies]
dxvkit-plus-core = { workspace = true }
dxvkit-plus-wgpu = { workspace = true }
dxvkit-plus-lmbd-enc = { workspace = true }
wgpu = { workspace = true }
png = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
dxvkit-plus-apple = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
png = { workspace = true }
