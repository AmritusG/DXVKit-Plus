[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
# MSRV: the oldest toolchain this workspace is built and tested with (let-chains, edition 2024).
rust-version = "1.95"
license = "MIT"
authors = ["Amrit Rosell"]
repository = "https://github.com/AmritusG/DXVKit-Plus"
homepage = "https://github.com/AmritusG/DXVKit-Plus"
keywords = ["video", "vj", "hap", "wgpu", "codec"]
categories = ["multimedia::video", "graphics"]
# crates.io publishing is Amrit's call later; nothing is published from this repo yet.
publish = false

[workspace.dependencies]
# Default features off: the Zstd decode backend (core's zstd-c / zstd-rust) is chosen once, by the
# crate being built; every crate that uses core forwards both features, zstd-c by default.
dxvkit-plus-core = { path = "crates/dxvkit-plus-core", version = "0.5.0", default-features = false }
dxvkit-plus-wgpu = { path = "crates/dxvkit-plus-wgpu", version = "0.5.0", default-features = false }
dxvkit-plus-apple = { path = "crates/dxvkit-plus-apple", version = "0.5.0", default-features = false }
dxvkit-plus-lmbd-enc = { path = "crates/dxvkit-plus-lmbd-enc", version = "0.5.0", default-features = false }
# Same wgpu major as Loombda-rs (D7: wgpu 30.x).
wgpu = "30.0.1"
wgpu-hal = { version = "30.0.1", features = ["metal"] }
pollster = "1.0.1"
bytemuck = { version = "1.25", features = ["derive"] }
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snap = "1.1.1"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-metal = "0.3.2"
objc2-io-surface = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-video = "0.3.2"
objc2-core-media = "0.3.2"
objc2-av-foundation = "0.3.2"

# Never-crash rules: every crate inherits these. `unsafe_code` is forbidden everywhere except
# `dxvkit-plus-apple`, which has its own lints table (see its Cargo.toml).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
dbg_macro = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.release]
debug = 1

# The LMBD encoder's RDO pass is millions of trial block decodes per frame; tests and debug builds
# run it optimised (codegen only — the code and its checks are the same).
[profile.dev.package.dxvkit-plus-lmbd-enc]
opt-level = 3
[profile.dev.package.dxvkit-plus-core]
opt-level = 3
